name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - platform: linux-x64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - platform: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build deviruchi
        run: cargo build --release --target ${{ matrix.target }}

      - name: Build devi-agent
        run: cargo build --release --target ${{ matrix.target }} --manifest-path devi-agent/Cargo.toml

      # ── Linux 打包 ──
      - name: Package (Linux)
        if: matrix.platform == 'linux-x64'
        run: |
          mkdir -p package/Deviruchi-linux-x64
          cp target/${{ matrix.target }}/release/deviruchi package/Deviruchi-linux-x64/
          cp target/${{ matrix.target }}/release/devi-agent package/Deviruchi-linux-x64/
          cp deviruchi.toml package/Deviruchi-linux-x64/
          cp -r db package/Deviruchi-linux-x64/
          cp -r assets package/Deviruchi-linux-x64/ 2>/dev/null || true
          cp README.md package/Deviruchi-linux-x64/
          # 创建启动脚本
          cat > package/Deviruchi-linux-x64/start.sh << 'BASH'
          #!/bin/bash
          cd "$(dirname "$0")"
          echo "╔══════════════════════════════════════════════════════════╗"
          echo "║  Deviruchi — 高性能 Ragnarok Online 服务端               ║"
          echo "║  按 Ctrl+C 停止服务器                                    ║"
          echo "╚══════════════════════════════════════════════════════════╝"
          ./deviruchi
          BASH
          chmod +x package/Deviruchi-linux-x64/start.sh
          cd package
          tar -czf ../Deviruchi-linux-x64.tar.gz Deviruchi-linux-x64

      # ── Windows 打包 ──
      - name: Package (Windows)
        if: matrix.platform == 'windows-x64'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package/Deviruchi-windows-x64
          Copy-Item target/${{ matrix.target }}/release/deviruchi.exe package/Deviruchi-windows-x64/
          Copy-Item target/${{ matrix.target }}/release/devi-agent.exe package/Deviruchi-windows-x64/
          Copy-Item deviruchi.toml package/Deviruchi-windows-x64/
          Copy-Item -Recurse db package/Deviruchi-windows-x64/
          Copy-Item -Recurse assets package/Deviruchi-windows-x64/ -ErrorAction SilentlyContinue
          Copy-Item README.md package/Deviruchi-windows-x64/
          # 创建启动脚本
          @"
          @echo off
          chcp 65001 >nul
          title Deviruchi - 高性能 Ragnarok Online 服务端
          echo ╔══════════════════════════════════════════════════════════╗
          echo ║  Deviruchi — 高性能 Ragnarok Online 服务端               ║
          echo ║  按 Ctrl+C 停止服务器                                    ║
          echo ╚══════════════════════════════════════════════════════════╝
          echo.
          cd /d "%~dp0"
          deviruchi.exe
          pause
          "@ | Out-File -Encoding utf8 package/Deviruchi-windows-x64/启动服务器.bat
          # 英文启动脚本（备用）
          @"
          @echo off
          chcp 65001 >nul
          title Deviruchi Game Server
          cd /d "%~dp0"
          deviruchi.exe
          pause
          "@ | Out-File -Encoding utf8 package/Deviruchi-windows-x64/start.bat
          Compress-Archive -Path package/Deviruchi-windows-x64 -DestinationPath Deviruchi-windows-x64.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Deviruchi-${{ matrix.platform }}
          path: |
            Deviruchi-${{ matrix.platform }}.*
            package/Deviruchi-${{ matrix.platform }}.*

  release:
    name: Upload to Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*.tar.gz
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Windows zip
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
