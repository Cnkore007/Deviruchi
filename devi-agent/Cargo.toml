[package]
name = "devi-agent"
version = "0.1.0"
edition = "2021"
description = "DeviAgent - Deviruchi 服务端智能助手"

[[bin]]
name = "devi-agent"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json"] }
rusqlite = { version = "0.31", features = ["bundled"] }
rustyline = "14"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = "0.3"
anyhow = "1"
chrono = "0.4"
async-trait = "0.1"
