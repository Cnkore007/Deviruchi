# Deviruchi Mob Drop Table
# Format: Mob ID -> List of drop entries
# - item_id: Item ID (0 = zeny)
# - min_amount: Minimum drop amount
# - max_amount: Maximum drop amount
# - chance: Drop chance in basis points (0-10000, where 10000 = 100%)
# - is_zeny: Whether this is zeny drop (item_id should be 0)
# - is_mvp_bonus: Whether this only drops for MVP (requires MVP ID)

