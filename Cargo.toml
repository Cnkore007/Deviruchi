[package]
name = "deviruchi"
version = "0.1.0"
edition = "2024"
authors = ["Deviruchi Team"]
description = "High-performance MMORPG game server in Rust"

[dependencies]
tokio = { version = "1", features = ["full"] }
rusqlite = { version = "0.31", features = ["bundled"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "1"
parking_lot = "0.12"
once_cell = "1"
clap = { version = "4", features = ["derive"] }

[lib]
name = "deviruchi"
path = "src/lib.rs"

[[bin]]
name = "deviruchi"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
