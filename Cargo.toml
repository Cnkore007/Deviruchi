[workspace]
members = ["devi", "devi-agent"]
resolver = "2"

[package]
name = "deviruchi"
version = "0.0.1"
edition = "2024"
authors = ["Deviruchi Team"]
description = "High-performance MMORPG game server in Rust"

[dependencies]
tokio = { version = "1", features = ["full"] }
rusqlite = { version = "0.31", features = ["bundled"] }
mysql = { version = "25", optional = true }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
anyhow = "1"
thiserror = "1"
parking_lot = "0.12"
once_cell = "1"
clap = { version = "4", features = ["derive"] }
bytes = "1"
tokio-util = { version = "0.7", features = ["codec"] }
uuid = { version = "1", features = ["v4", "serde"] }
rand = "0.8"
regex = "1"
log = "0.4"
futures-util = { version = "0.3", features = ["sink"] }
tokio-tungstenite = "0.21"
pathfinding = "4"
notify = "6"
chrono = { version = "0.4", features = ["serde"] }
argon2 = "0.5"
dashmap = "5"

[features]
default = []
mysql-backend = ["dep:mysql"]

[lib]
name = "deviruchi"
path = "src/lib.rs"

[[bin]]
name = "deviruchi"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
