[package]
name = "devi"
version = "0.1.0"
edition = "2021"
description = "Devi - 现代化 RO 客户端"

[dependencies]
bevy = { version = "0.15", features = ["wayland"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
tracing = "0.1"
tracing-subscriber = "0.3"
async-trait = "0.1"
flate2 = "1"
byteorder = "1"
image = "0.25"
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }
futures-util = "0.3"
pollster = "0.4"

[dev-dependencies]
bevy = { version = "0.15", features = ["wayland"] }
