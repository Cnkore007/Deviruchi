[package]
name = "devi"
version = "0.1.0"
edition = "2021"

[dependencies]
bevy = "0.14"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.21"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"

[profile.dev]
opt-level = 0
debug = true
